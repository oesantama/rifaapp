version: '3.8'

# Local development: always uses backend/data.json (never production Firebase).
# Production (Render) selects Firestore automatically (RENDER=true).
services:
  rifaapp-backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: rifaapp-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_SOURCE=local
    volumes:
      - ./backend/data.json:/app/data.json:z
      # Encryption key for data.json: must persist, otherwise the data cannot be read again
      - ./backend/secrets:/app/secrets:z
      # Automatic safety copies (daily and before restore/reset)
      - ./backend/backups:/app/backups:z
    restart: always
