name: Build Android APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed to publish the APK as a GitHub release when a version tag is pushed
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # The signing key lives in the ANDROID_KEYSTORE_BASE64 secret (never in the public repo):
      # every APK gets the same signature, so updates install over the previous version.
      - name: Restore Release Keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore restaurado desde el secreto de GitHub."
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64: se generará una firma temporal y el APK no se podrá instalar encima de versiones anteriores."
          fi

      - name: Ensure Release Keystore
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias rifamasterkey \
              -storepass rifamaster123 \
              -keypass rifamaster123 \
              -dname "CN=RifaMaster, OU=Development, O=RifaMaster, L=City, S=State, C=CO"
          fi

      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL=https://rifaapp-backend.onrender.com/api

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Version tags (v3.0.2, ...) publish the APK as a release: the app's "new version" banner downloads
      # https://github.com/oesantama/rifaapp/releases/latest/download/rifa-master.apk
      - name: Publish release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk rifa-master.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rifa Master ${{ github.ref_name }}
          body: "Instale rifa-master.apk encima de la versión anterior; no pierde sus datos. Cambios: ver CHANGELOG.md."
          files: rifa-master.apk
          make_latest: true
