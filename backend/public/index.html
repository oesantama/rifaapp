<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema profesional de control de rifas, boletas, asesores y premios.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Opens full screen, like an app, when added to the Home Screen / Dock from Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rifa Master">
  <!-- iOS/iPadOS/macOS: solid 180x180 icon (iOS fills transparency with black and rounds corners itself) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rifa Master</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @media print {
      @page {
        size: auto;
        margin: 0;
      }
      body {
        background: white !important;
      }
      flt-glass-pane {
        box-shadow: none !important;
      }
    }
    /* Branded splash while Flutter loads (removed on first frame) */
    html, body { margin: 0; height: 100%; background: #0F172A; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 30% 20%, #1E3A8A 0%, #0F172A 65%);
      font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #fff;
      transition: opacity .35s ease;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    #splash h1 { margin: 0; font-size: 22px; letter-spacing: 3px; font-weight: 700; }
    #splash p { margin: 0; font-size: 12px; color: #94A3B8; }
    #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #F59E0B; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Rifa Master">
    <h1>RIFA MASTER</h1>
    <p>Control profesional de rifas y boletas</p>
    <div class="bar"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
